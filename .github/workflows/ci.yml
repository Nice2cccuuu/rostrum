name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CJK fonts
        # Capacity measurement is only meaningful against a real font; without
        # one the metrics tests fall back and stop being informative.
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -e ".[dev,pptx]"
      - run: ruff check src tests scripts
      - run: pytest

  schemas-up-to-date:
    # The exported schemas are the contract for non-Python consumers, so a
    # stale checked-in copy is a defect.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: PYTHONPATH=src python3 scripts/export_schemas.py
      - name: Fail if schemas or examples drifted
        run: git diff --exit-code -- schemas/ examples/
